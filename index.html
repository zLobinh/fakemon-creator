<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criador de Fakemon PMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lato:wght@300;400;700&display=swap">
<style>
/* Visual de programa de desktop (inspirado no FakemonCreator) com as cores do PMP.
   Escuro = modo escuro do app; claro = PMP original (faixa vermelha, placas creme). */
:root {
  --win: #f0f0f0; --chrome: linear-gradient(#4ff2cd, #2fe2b2); --chrome-ink: #141414; --chrome-2: #24d6a2;
  --panel: #ffffff; --field: #ffffff; --line: #bfe6d8; --ink: #262420; --muted: #6b6b6b;
  --accent: #1fc493; --accent-ink: #ffffff; --sel: #1fc493; --sel-ink: #ffffff;
  --title: #17b384; --mark: #ffffff; --focus: #0e8f68; --ok: #1f9a1f; --warn: #b8740f; --bad: #c0392b;
  --custom: #0e9a6e;
  --body: "Lato", system-ui, sans-serif; --display: "Cinzel", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --win: #161213; --chrome: #1f1719; --chrome-ink: #e6dbdb; --chrome-2: #2a1e21;
  --panel: #1c1617; --field: #2a2124; --line: #3d2f33; --ink: #e6dbdb; --muted: #a8979a;
  --accent: #8f2933; --accent-ink: #ffffff; --sel: #8f2933; --sel-ink: #ffffff;
  --title: #ed8c91; --mark: #ec9e29; --focus: #ec9e29; --ok: #6cc28a; --warn: #e3a64a; --bad: #ff8a80;
  --custom: #ed8c91; color-scheme: dark; } }
:root[data-theme="dark"] {
  --win: #161213; --chrome: #1f1719; --chrome-ink: #e6dbdb; --chrome-2: #2a1e21;
  --panel: #1c1617; --field: #2a2124; --line: #3d2f33; --ink: #e6dbdb; --muted: #a8979a;
  --accent: #8f2933; --accent-ink: #ffffff; --sel: #8f2933; --sel-ink: #ffffff;
  --title: #ed8c91; --mark: #ec9e29; --focus: #ec9e29; --ok: #6cc28a; --warn: #e3a64a; --bad: #ff8a80;
  --custom: #ed8c91; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--win); color: var(--ink); font: 14px/1.4 var(--body); min-height: 100vh; display: flex; flex-direction: column; }

/* Barra de título + menu + abas */
.titlebar { background: var(--chrome); color: var(--chrome-ink); text-align: center; padding: 6px 16px; font-size: 13px; opacity: .95; }
.titlebar b { font: 700 13px var(--display); letter-spacing: .04em; }
.menubar { background: var(--chrome); color: var(--chrome-ink); display: flex; flex-wrap: wrap; gap: 2px; padding: 0 8px 2px; }
.menubar button, .menubar label { background: none; border: 0; color: inherit; font: 13px var(--body); padding: 4px 10px; border-radius: 3px; cursor: pointer; }
.menubar button:hover, .menubar label:hover { background: var(--chrome-2); }
.menubar .spacer { flex: 1; }
.tabbar { background: var(--chrome-2); display: flex; flex-wrap: wrap; padding: 0 8px; border-bottom: 1px solid var(--line); }
.tabbar button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--chrome-ink); opacity: .8; font: 13px var(--body); padding: 6px 12px; cursor: pointer; }
.tabbar button[aria-selected="true"] { opacity: 1; border-bottom-color: var(--mark); font-weight: 700; }
.tabbar .count { opacity: .7; font-weight: 400; }

/* Área principal: lista à esquerda, ficha à direita */
.work { flex: 1; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); max-width: 1240px; width: 100%; margin: 0 auto; align-items: start; }
.work.single { grid-template-columns: minmax(0, 720px); justify-content: center; }
@media (max-width: 820px) { .work { grid-template-columns: minmax(0, 1fr); } }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side h2, .pane h2 { font: 300 22px var(--body); color: var(--title); margin: 0; }
.listbox { background: var(--field); border: 1px solid var(--line); min-height: 220px; max-height: 46vh; overflow: auto; padding: 2px 0; }
.listbox .row { display: flex; justify-content: space-between; gap: 6px; width: 100%; border: 0; background: none; color: var(--ink); text-align: left; padding: 3px 8px; font: 14px var(--body); cursor: pointer; }
.listbox .row:hover { background: color-mix(in srgb, var(--sel) 18%, transparent); }
.listbox .row.on { background: var(--sel); color: var(--sel-ink); }
.listbox .row small { opacity: .75; font-variant-numeric: tabular-nums; }
.listbox .empty { color: var(--muted); padding: 6px 8px; font-size: 13px; }
.cap { font-size: 12px; color: var(--muted); }
.imgprev { display: flex; flex-direction: column; gap: 6px; }
.imgprev canvas { background: transparent; border: 1px dashed var(--line); image-rendering: pixelated; max-width: 100%; height: auto; align-self: flex-start; }
@media (max-width: 820px) {
  .listbox { min-height: 0; max-height: 170px; }
  .side .imgprev { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; }
  .side .imgprev .cap { grid-column: 1 / -1; }
  .side .imgprev canvas { grid-row: span 2; }
}

/* Controles no estilo do programa */
.btn { background: var(--field); color: var(--ink); border: 1px solid var(--line); font: 13px var(--body); padding: 5px 12px; cursor: pointer; text-align: center; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.block { width: 100%; }
input, select, textarea { font: 14px var(--body); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 0; padding: 4px 7px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 110px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }

.pane { min-width: 0; }
.species { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px; margin-bottom: 10px; }
.species span { font: 300 34px var(--body); color: var(--title); }
.species input { font: 300 30px var(--body); padding: 6px 10px; }
.inline { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-bottom: 18px; }
.inline label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.inline input, .inline select { width: auto; }
.inline input[type=number] { width: 70px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 28px; align-items: start; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* Formulário com rótulo à esquerda */
.form { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 10px; align-items: center; }
.form > .lbl { font-size: 13px; color: var(--muted); }
.form2 { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); gap: 3px 10px; align-items: center; }
.form2 > .lbl { font-size: 13px; color: var(--muted); }
@media (max-width: 520px) { .form2 { grid-template-columns: max-content minmax(0, 1fr); } }

/* Atributos: caixa com número grande */
.attrs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.attrs label { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.attrs input { font: 300 26px var(--body); text-align: left; padding: 4px 8px; height: 46px; }
@media (max-width: 520px) { .attrs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* Lista com caixa + "adicionar" embaixo (igual as listas do programa) */
.lb { display: flex; flex-direction: column; min-width: 0; }
.lb .lb-title { font-size: 13px; color: var(--muted); margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.lb.big .lb-title { font: 300 19px var(--body); color: var(--title); }
.lb .lb-box { background: var(--field); border: 1px solid var(--line); min-height: 96px; max-height: 210px; overflow: auto; padding: 2px 0; }
.lb.tall .lb-box { min-height: 150px; }
.lb .lb-row { display: flex; justify-content: space-between; align-items: center; padding: 1px 4px 1px 8px; font-size: 14px; }
.lb .lb-row:hover { background: color-mix(in srgb, var(--sel) 18%, transparent); }
.lb .lb-row.custom span { color: var(--custom); font-weight: 700; }
.lb .lb-row button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 4px; }
.lb .lb-row button:hover { color: var(--bad); }
.lb .lb-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; margin-top: -1px; }
.lb .lb-add input, .lb .lb-add select { border-top-color: var(--line); }
.lb .lb-add .btn { border-left: 0; }
.levels { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 18px; }
@media (max-width: 520px) { .levels { grid-template-columns: minmax(0, 1fr); } }
.levels .lv-head { display: flex; align-items: center; gap: 6px; }
.levels .lv-head input { width: 56px; padding: 1px 4px; }
.addlevel { border: 1px dashed var(--line); background: none; color: var(--muted); min-height: 120px; cursor: pointer; font: 13px var(--body); }
.addlevel:hover { border-color: var(--accent); color: var(--ink); }

.checks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.check { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
.check input { width: auto; accent-color: var(--accent); }

/* Caixa de grupo (automações etc.) */
fieldset.group { border: 1px solid var(--line); padding: 10px 12px 12px; margin: 0; min-width: 0; }
fieldset.group > legend { padding: 0 6px; font-size: 13px; color: var(--title); font-weight: 700; }
fieldset.group .hdr { display: flex; justify-content: flex-end; margin: -4px 0 6px; }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; max-width: 72ch; }
.sub { font: 300 19px var(--body); color: var(--title); margin: 18px 0 6px; }
.dmg { display: grid; grid-template-columns: max-content 70px 90px; gap: 3px 8px; align-items: center; }
.dmg .lbl { font-size: 13px; color: var(--muted); }

.msgs { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; }
.msg { border-left: 3px solid var(--line); padding: 3px 10px; background: var(--field); }
.msg.bad { border-color: var(--bad); } .msg.warn { border-color: var(--warn); } .msg.ok { border-color: var(--ok); }
.steps { margin: 0; padding-left: 20px; max-width: 70ch; } .steps li { margin-bottom: 5px; }
.statusbar { background: var(--chrome-2); color: var(--chrome-ink); font-size: 12px; padding: 3px 12px; display: flex; justify-content: space-between; gap: 10px; opacity: .9; padding-bottom: calc(3px + env(safe-area-inset-bottom, 0px)); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(34px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--win); padding: 7px 14px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
.sep { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.vis { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin: 6px 0 12px; }
.visopt { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); background: var(--field); padding: 10px; cursor: pointer; }
.visopt input { width: auto; margin-top: 3px; accent-color: var(--accent); }
.linkbox { margin-top: 10px; }
.linkbox input { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.pkglist { display: flex; flex-direction: column; gap: 8px; }
.pkg { border: 1px solid var(--line); background: var(--field); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.pkg-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 12px; padding: 1px 8px; border: 1px solid var(--line); white-space: nowrap; }
.badge.public { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.badge.pending { border-color: var(--warn); color: var(--warn); }
.badge.rejected { border-color: var(--bad); color: var(--bad); }
.previewbox { border-top: 1px solid var(--line); padding-top: 8px; }
.downloads { font-size: 13px; }
.downloads b { font-size: 18px; color: var(--title); font-variant-numeric: tabular-nums; }
.preview { display: flex; flex-direction: column; gap: 4px; }
.pv-row { display: flex; gap: 10px; align-items: center; }
.pv-row img { image-rendering: pixelated; flex: none; }
.pv-noimg { width: 63px; height: 63px; border: 1px dashed var(--line); flex: none; }
</style>
</head>

function loadDraft() {

let saveTimer = null;

  clearTimeout(saveTimer);

function newPokemon(pack) {

  let idx = FIRST_INDEX; while (used.has(idx)) idx++;

    ac: 12, hp: 15, hitDice: 8, sr: 1, minLevel: 1, attrs: { STR: 10, DEX: 10, CON: 10, INT: 10, WIS: 10, CHA: 10 },
    wsp: 30, ssp: 0, fsp: 0, csp: 0, bsp: 0, senses: {}, skills: [], abilities: [], hidden: "",
    startMoves: [], levelMoves: [], tmMoves: [], eggMoves: [], evolveTo: "", evolveLevel: 0, evolvePoints: 0,
    stage: 1, stages: 1, gender: "3", sprite: null, icon: null };
}

const $ = (q, root = document) => root.querySelector(q);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
let uid = 0; const nid = p => `${p}-${++uid}`;
function toast(text) { const t = $("#toast"); t.textContent = text; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2200); }

// Controle ligado a obj[key]
function control(obj, key, opts = {}) {
  let input;
  const set = v => { obj[key] = v; saveDraft(); if (opts.onchange) opts.onchange(v); };
  if (opts.options) {
    input = h("select", { id: opts.id, "aria-label": opts.aria }, opts.options.map(([v, t]) => h("option", { value: v, selected: String(obj[key] ?? "") === String(v) }, t)));
    input.addEventListener("change", () => set(opts.number ? Number(input.value) : input.value));
  } else if (opts.textarea) {
    input = h("textarea", { id: opts.id, placeholder: opts.placeholder || "", "aria-label": opts.aria }); input.value = obj[key] || "";
    input.addEventListener("input", () => set(input.value));
  } else {
    input = h("input", { id: opts.id, type: opts.number ? "number" : "text", step: opts.step || (opts.number ? "1" : null), min: opts.min, max: opts.max, list: opts.list, placeholder: opts.placeholder || "", "aria-label": opts.aria });
    input.value = obj[key] ?? "";
    input.addEventListener("input", () => set(opts.number ? (input.value === "" ? 0 : Number(input.value)) : input.value));
  }
  return input;
}
// Linhas "rótulo | campo" para .form / .form2
function rows(...defs) {
  const out = [];
  for (const [label, obj, key, opts] of defs) { const id = nid("f"); out.push(h("label", { class: "lbl", for: id }, label), control(obj, key, { ...(opts || {}), id })); }
  return out;
}
// Campo com rótulo em cima (usado nas automações)
function field(label, obj, key, opts = {}) {
  const id = nid("f");
  return h("label", { class: "lbl-top", for: id, style: "display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:0" }, label, control(obj, key, { ...opts, id }));
}

// Lista no estilo do programa: caixa com os itens + campo de adicionar embaixo
function listBox(title, arr, opts = {}) {
  const box = h("div", { class: "lb" + (opts.big ? " big" : "") + (opts.tall ? " tall" : "") });
  const rowsEl = h("div", { class: "lb-box", role: "list" });
  const show = v => opts.display ? opts.display(v) : v;
  const isCustom = v => opts.source ? opts.source().custom.has(v) : false;
  const render = () => {
    rowsEl.replaceChildren(...arr.map((n, i) => h("div", { class: "lb-row" + (isCustom(n) ? " custom" : ""), role: "listitem" }, h("span", {}, show(n)),
      h("button", { title: "Remover " + show(n), "aria-label": "Remover " + show(n), onclick: () => { arr.splice(i, 1); saveDraft(); render(); } }, "×"))));
  };
  let adder;
  if (opts.options) {
    const s = h("select", { "aria-label": "Adicionar em " + title }, h("option", { value: "" }, "Adicionar…"), opts.options.map(([v, t]) => h("option", { value: v }, t)));
    s.addEventListener("change", () => { if (s.value && !arr.includes(s.value)) { arr.push(s.value); saveDraft(); render(); } s.value = ""; });
    adder = h("div", { class: "lb-add", style: "grid-template-columns:minmax(0,1fr)" }, s);
  } else {
    const listId = nid("dl");
    const input = h("input", { list: listId, placeholder: "Digite e aperte Enter", "aria-label": "Adicionar em " + title });
    const add = () => { const v = input.value.trim(); if (v && !arr.includes(v)) { arr.push(v); saveDraft(); render(); } input.value = ""; };
    input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add(); } });
    input.addEventListener("change", () => { if (opts.source && opts.source().all.includes(input.value.trim())) add(); });
    const dl = h("datalist", { id: listId }, (opts.source ? opts.source().all : []).map(n => h("option", { value: n })));
    adder = h("div", { class: "lb-add" }, input, h("button", { class: "btn", onclick: add, "aria-label": "Adicionar" }, "+"), dl);
  }
  render();
  box.append(h("div", { class: "lb-title" }, opts.titleNode || title, opts.extra || null), rowsEl, adder);
  return box;
}
const moveSource = () => { const custom = new Set(state.moves.map(m => m.name).filter(Boolean)); return { custom, all: [...custom, ...LISTS.moves] }; };
const abilitySource = () => { const custom = new Set(state.abilities.map(a => a.name).filter(Boolean)); return { custom, all: [...custom, ...LISTS.abilities] }; };
const tmSource = () => ({ custom: new Set(), all: Object.keys(TM_BY_NAME).sort() });

const TABS = [["pokemon", "Fakemons"], ["moves", "Moves"], ["abilities", "Habilidades"], ["items", "Itens"], ["pack", "Pacote"], ["export", "Publicar"]];

function render() {

  else if (tab === "admin") main.replaceChildren(renderAdmin());
  else main.replaceChildren(...renderCollection(tab));
}

const LABELS = { pokemon: ["Fakemon", "Lista de Fakemons", "Espécie"], moves: ["Move", "Lista de Moves", "Move"], abilities: ["Habilidade", "Lista de Habilidades", "Habilidade"], items: ["Item", "Lista de Itens", "Item"] };
function renderCollection(kind) {
  const arr = state[kind];
  const [label, listTitle] = LABELS[kind];
  const maker = { pokemon: newPokemon, moves: newMove, abilities: newAbility, items: newItem }[kind];
  if (sel[kind] >= arr.length) sel[kind] = Math.max(0, arr.length - 1);
  const obj = arr[sel[kind]];
  const side = h("aside", { class: "side" },

    h("div", { class: "listbox", role: "listbox", "aria-label": listTitle },
      arr.length ? arr.map((o, i) => h("button", { class: "row" + (i === sel[kind] ? " on" : ""), role: "option", "aria-selected": String(i === sel[kind]), onclick: () => { sel[kind] = i; render(); } },
        h("span", {}, o.name || "(sem nome)"), kind === "pokemon" ? h("small", {}, "#" + o.index) : null))
        : h("p", { class: "empty" }, "Nenhum ainda.")),
    h("button", { class: "btn primary block", onclick: () => { arr.push(maker(state)); sel[kind] = arr.length - 1; saveDraft(); render(); } }, "+ Novo " + label),
    obj ? h("button", { class: "btn danger block", onclick: (ev) => {
      const b = ev.currentTarget;
      if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Clique de novo para apagar"; setTimeout(() => { if (b.isConnected) { b.textContent = "Apagar " + label.toLowerCase(); delete b.dataset.armed; } }, 3000); return; }
      arr.splice(sel[kind], 1); saveDraft(); render(); toast(label + " apagado");
    } }, "Apagar " + label.toLowerCase()) : null);
  if (kind === "pokemon" && obj) side.append(imageInput(obj, "sprite", 126, 126, "Retrato"), imageInput(obj, "icon", 40, 30, "Ícone"),
    h("p", { class: "hint" }, "Sem ícone, o pacote usa o retrato reduzido."));
  const pane = h("section", { class: "pane" });
  if (!obj) pane.append(h("p", { class: "hint" }, "Crie um pelo botão + Novo " + label + "."));
  else pane.append({ pokemon: editPokemon, moves: editMove, abilities: editAbility, items: editItem }[kind](obj));
  return [side, pane];
}

function imageInput(p, key, w, hgt, label) {
  const canvas = h("canvas", { width: w, height: hgt, style: `width:${key === "icon" ? w * 1.5 : w}px` });
  const draw = () => {
    const ctx = canvas.getContext("2d"); ctx.clearRect(0, 0, w, hgt);
    if (p[key]) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0); img.src = p[key]; }
  };
  const id = nid("img");
  const input = h("input", { id, type: "file", accept: "image/png,image/jpeg,image/webp", hidden: true });
  input.addEventListener("change", () => {
    const f = input.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        // Encaixa no tamanho que o app usa, sem distorcer, com fundo transparente
        const c = document.createElement("canvas"); c.width = w; c.height = hgt;
        const ctx = c.getContext("2d"); ctx.imageSmoothingEnabled = true;
        const s = Math.min(w / img.width, hgt / img.height);
        const dw = Math.round(img.width * s), dh = Math.round(img.height * s);
        ctx.drawImage(img, Math.floor((w - dw) / 2), Math.floor((hgt - dh) / 2), dw, dh);
        p[key] = c.toDataURL("image/png"); if (key === "icon") p.iconAuto = false; saveDraft(); draw();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  });
  draw();
  return h("div", { class: "imgprev" }, h("span", { class: "cap" }, `${label} (${w}x${hgt})`), canvas,
    h("label", { class: "btn block", for: id }, "Escolher " + label.toLowerCase()), input,
    h("button", { class: "btn small", onclick: () => { p[key] = null; saveDraft(); draw(); } }, "Remover"));
}

  const syncTypes = () => { const a = [t1.value]; if (t2.value && t2.value !== t1.value) a.push(t2.value); p.types.splice(0, p.types.length, ...a); saveDraft(); };
  t1.addEventListener("change", syncTypes); t2.addEventListener("change", syncTypes);

    inl("Tamanho", p, "size", { options: SIZES.map(s => [s, s]) }),
    inl("Gênero", p, "gender", { options: [["3", "Qualquer"], ["0", "Sem gênero"], ["1", "Só macho"], ["2", "Só fêmea"]] }));

  const attrs = h("div", { class: "attrs" }, ATTRS.map(([en, pt]) => { const id = nid("a"); return h("label", { for: id }, pt, control(p.attrs, en, { id, number: true, min: 1, max: 30 })); }));

  const left = h("div", { class: "stack" },
    attrs,
    h("div", { class: "form" }, rows(

    h("datalist", { id: "dl-abilities" }, abilitySource().all.map(n => h("option", { value: n }))),
    listBox("Habilidades", p.abilities, { big: true, source: abilitySource }),

    h("div", { class: "lb big" }, h("div", { class: "lb-title" }, "Entrada da Pokédex"), control(p, "flavor", { textarea: true, aria: "Entrada da Pokédex" })),
    h("div", { class: "form2" }, rows(
      ["Espécie", p, "genus", { placeholder: "O Pokémon Brasa" }],
      ["Altura (m)", p, "height", { number: true, step: "0.1", min: 0 }],
      ["Peso (kg)", p, "weight", { number: true, step: "0.1", min: 0 }])));

  const levels = h("div", { class: "levels" });
  const renderLevels = () => {
    levels.replaceChildren(...p.levelMoves.map((row, i) => {
      const lv = h("input", { type: "number", min: 1, max: 20, value: row.level, "aria-label": "Nível" });
      lv.addEventListener("input", () => { row.level = Number(lv.value) || 1; saveDraft(); });

        titleNode: h("span", { class: "lv-head" }, "Moves no nível", lv),
        extra: h("button", { class: "btn small danger", onclick: () => { p.levelMoves.splice(i, 1); saveDraft(); renderLevels(); } }, "Remover") });
    }), h("button", { class: "addlevel", onclick: () => { const last = p.levelMoves.length ? p.levelMoves[p.levelMoves.length - 1].level : 1; p.levelMoves.push({ level: Math.min(20, last + 1), moves: [] }); saveDraft(); renderLevels(); } }, "+ Adicionar nível"));
  };
  renderLevels();

  const right = h("div", { class: "stack" },
    h("div", { class: "form2" }, rows(
      ["Caminhada", p, "wsp", { number: true, min: 0, step: "5" }],
      [SENSES[0][1], p.senses, SENSES[0][0], { number: true, min: 0, step: "5" }],

const splitList = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);
function ampEntry(e, owner) {
  const out = {};
  if (e.kind === "dice") { out.points = 0; out.dice_multiplier = Number(e.mult) === 0.5 ? 0.5 : 2; }
  else { out.points = Number(e.points) || 0; if (e.kind === "red") out.reduction = true; }
  if (e.types.length) out.types = [...e.types];
  if (e.range) out.range = e.range;
  if (e.condition) out.condition = e.condition;
  if (e.special) out[e.special] = true;
  const mv = splitList(e.moves); if (mv.length) out.moves = mv;
  const nc = splitList(e.contains); if (nc.length) out.name_contains = nc;
  if (owner !== "move" && e.activatable) out.activatable = true;
  if (e.label) out.label = e.label.slice(0, 60);
  return out;
}
function amountValue(e, key) { if (!e[key]) return undefined; if (e[key] === "num") return Number(e[key + "Num"]) || undefined; return e[key]; }
function bonusEntry(e, owner) {
  const out = {};
  const put = (k, v) => { if (v !== undefined && v !== 0 && v !== "" && v !== null && !Number.isNaN(v)) out[k] = v; };
  put("ac_bonus", Number(e.ac)); put("save_bonus", Number(e.save)); put("attack_roll_bonus", Number(e.attack)); put("save_dc_bonus", Number(e.dc));
  put("speed_bonus", Number(e.speed)); if (e.speedMult) out.speed_multiplier = Number(e.speedMult);

  put("melee_damage_bonus", amountValue(e, "melee")); put("ranged_damage_bonus", amountValue(e, "ranged"));

    const sp = splitList(e.species); if (sp.length) out.restricted_species = sp;

    if (Object.keys(attrs).length) out.attributes = attrs;
    put("attr_highest", Number(e.highest)); if (e.condition) out.condition = e.condition; if (e.activatable) out.activatable = true;

}

function slug(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "") || "fakemon"; }

function validate() {
  const msgs = [];
  const m = state.meta;
  if (!m.name.trim()) msgs.push(["bad", "Dê um nome ao pacote (aba Pacote)."]);
  if (!state.pokemon.length && !state.moves.length && !state.abilities.length && !state.items.length) msgs.push(["bad", "O pacote está vazio."]);
  const names = new Set(), idx = new Set();
  const knownAbilities = new Set(abilitySource().all), knownMoves = new Set(moveSource().all);
  for (const p of state.pokemon) {
    const n = p.name.trim() || "(sem nome)";
    if (!p.name.trim()) msgs.push(["bad", "Tem um Fakemon sem nome."]);
    if (names.has(p.name)) msgs.push(["bad", `Dois Fakemons com o nome ${n}.`]); names.add(p.name);
    if (idx.has(Number(p.index))) msgs.push(["bad", `${n}: número ${p.index} repetido.`]); idx.add(Number(p.index));
    if (Number(p.index) <= LISTS.max_index) msgs.push(["bad", `${n}: o número precisa ser maior que ${LISTS.max_index} (os do app).`]);
    if (!p.types.length) msgs.push(["bad", `${n}: escolha pelo menos um tipo.`]);
    if (!p.abilities.length) msgs.push(["bad", `${n}: escolha pelo menos uma habilidade.`]);
    for (const a of [...p.abilities, p.hidden].filter(Boolean)) if (!knownAbilities.has(a)) msgs.push(["warn", `${n}: a habilidade "${a}" não existe no app nem no pacote.`]);
    const allMoves = [...p.startMoves, ...p.eggMoves, ...p.levelMoves.flatMap(r => r.moves)];
    for (const mv of allMoves) if (!knownMoves.has(mv)) msgs.push(["warn", `${n}: o Move "${mv}" não existe no app nem no pacote.`]);
    for (const tm of p.tmMoves) if (!(tm in TM_BY_NAME)) msgs.push(["warn", `${n}: "${tm}" não é TM no app (vai ser ignorado).`]);
    if (!p.sprite) msgs.push(["warn", `${n}: sem retrato (o app mostra uma Pokébola).`]);
    else if (!p.icon || p.iconAuto) msgs.push(["warn", `${n}: sem ícone; vai ser feito do retrato.`]);
  }
  for (const mv of state.moves) if (!mv.name.trim()) msgs.push(["bad", "Tem um Move sem nome."]);
  for (const a of state.abilities) if (!a.name.trim()) msgs.push(["bad", "Tem uma Habilidade sem nome."]);
  for (const it of state.items) if (!it.name.trim()) msgs.push(["bad", "Tem um Item sem nome."]);
  return msgs;
}

function buildData() {
  const sizeText = p => `${p.size} (${String(Number(p.height || 0).toFixed(1)).replace(".", ",")} m)`;
  const data = { "pokemon.json": {}, "moves.json": {}, "abilities.json": {}, "items.json": {}, "evolve.json": {}, "gender.json": {}, "pokedex_extra.json": {}, "automations.json": { abilities: {}, items: {}, moves: {} } };
  const images = {};
  for (const p of state.pokemon) {
    const lvl = {};
    for (const r of p.levelMoves) { if (!r.moves.length) continue; const k = String(Math.max(1, Math.min(20, r.level))); lvl[k] = [...(lvl[k] || []), ...r.moves]; }
    const out = { index: Number(p.index), Type: [...p.types], size: sizeText(p), AC: Number(p.ac), HP: Number(p.hp), "Hit Dice": Number(p.hitDice),
      SR: Number(p.sr), "MIN LVL FD": Number(p.minLevel), attributes: { ...p.attrs }, Abilities: [...p.abilities], Skill: [...p.skills],
      Moves: { "Starting Moves": [...p.startMoves], Level: lvl, TM: p.tmMoves.filter(t => t in TM_BY_NAME).map(t => TM_BY_NAME[t]).sort((a, b) => a - b), egg: [...p.eggMoves] } };
    if (p.hidden) out["Hidden Ability"] = p.hidden;
    if (p.wsp) out.WSp = Number(p.wsp); if (p.ssp) out.Ssp = Number(p.ssp); if (p.fsp) out.Fsp = Number(p.fsp);
    if (p.csp) out["Climbing Speed"] = Number(p.csp); if (p.bsp) out["Burrowing Speed"] = Number(p.bsp);
    const senses = SENSES.filter(([en]) => Number(p.senses[en])).map(([en]) => `${en} ${Number(p.senses[en])}ft`);
    if (senses.length) out.Senses = senses;
    if (p.evolveTo) out.Evolve = p.evolveTo;
    const base = slug(p.name);
    if (p.sprite) { out.sprite = base + "_sprite.png"; images[out.sprite] = p.sprite; }
    if (p.icon) { out.icon = base + "_icon.png"; images[out.icon] = p.icon; }
    data["pokemon.json"][p.name] = out;
    const ev = { current_stage: Number(p.stage) || 1, total_stages: Number(p.stages) || 1 };
    if (p.evolveTo) Object.assign(ev, { into: [p.evolveTo], level: Number(p.evolveLevel) || 1, points: Number(p.evolvePoints) || 0 });
    data["evolve.json"][p.name] = ev;
    if (p.gender !== "3") data["gender.json"][p.name] = Number(p.gender);
    data["pokedex_extra.json"][String(p.index)] = { flavor: p.flavor, genus: p.genus, height: Math.round(Number(p.height) * 10), weight: Math.round(Number(p.weight) * 10) };
  }
  for (const m of state.moves) {
    const out = { Name: m.name, Type: m.type, PP: Number(m.pp), "Move Time": m.time, Duration: m.duration, Range: m.range, Description: m.description };
    if (m.scaling) out.Scaling = m.scaling;
    if (m.power.length) out["Move Power"] = Object.fromEntries(m.power.map(a => [a, 0]));
    if (m.roll === "atk") out.atk = true; else if (m.roll === "save") out.Save = m.save;
    if (m.damage.on) {
      out.Damage = {};
      for (const [lvl, key] of [["1", "d1"], ["5", "d5"], ["10", "d10"], ["17", "d17"]]) {
        out.Damage[lvl] = { amount: Number(m.damage[key][0]), dice_max: Number(m.damage[key][1]) };
        if (m.damage.move) out.Damage[lvl].move = true;
      }
    }
    data["moves.json"][m.name] = out;
    const entries = m.effects.filter(e => e.kind !== "bonus").map(e => ampEntry(e, "move"));
    if (entries.length) data["automations.json"].moves[m.name] = entries;
  }
  for (const a of state.abilities) {
    data["abilities.json"][a.name] = { Description: a.description };
    const amp = a.effects.filter(e => e.kind !== "bonus").map(e => ampEntry(e, "ability"));
    const bonusE = a.effects.find(e => e.kind === "bonus"); const bonus = bonusE ? bonusEntry(bonusE, "ability") : null;
    if (amp.length || bonus) data["automations.json"].abilities[a.name] = Object.assign({}, amp.length ? { amplification: amp } : {}, bonus ? { bonuses: bonus } : {});
  }
  for (const it of state.items) {
    data["items.json"][it.name] = { Effect: it.effect };
    const ampE = it.effects.find(e => e.kind !== "bonus"); const bonusE = it.effects.find(e => e.kind === "bonus");
    const bonus = bonusE ? bonusEntry(bonusE, "item") : null;
    if (ampE || bonus) data["automations.json"].items[it.name] = Object.assign({}, ampE ? { amplification: ampEntry(ampE, "item") } : {}, bonus ? { bonuses: bonus } : {});
  }
  return { data, images };
}

// Ícone 40x30 feito do retrato: corta a parte transparente em volta e encaixa
function iconFromSprite(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
      const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0);
      const px = ctx.getImageData(0, 0, c.width, c.height).data;
      let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
      for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
        if (px[(y * c.width + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      if (x1 < 0) { x0 = 0; y0 = 0; x1 = c.width - 1; y1 = c.height - 1; }
      const w = x1 - x0 + 1, hh = y1 - y0 + 1;
      const out = document.createElement("canvas"); out.width = 40; out.height = 30;
      const o = out.getContext("2d");
      const s = Math.min(40 / w, 30 / hh);
      const dw = Math.max(1, Math.round(w * s)), dh = Math.max(1, Math.round(hh * s));
      o.drawImage(c, x0, y0, w, hh, Math.floor((40 - dw) / 2), Math.floor((30 - dh) / 2), dw, dh);
      resolve(out.toDataURL("image/png"));
    };
    img.onerror = () => resolve(null);
    img.src = dataUrl;
  });
}

const SESSION_KEY = "pmp-fakemon-session";
let session = null, me = null;
try { session = localStorage.getItem(SESSION_KEY); } catch (e) {}
(function readLoginReturn() {
  const hp = new URLSearchParams(location.hash.slice(1));
  const err = hp.get("pmp_error");
  if (hp.get("pmp_session")) { session = hp.get("pmp_session"); try { localStorage.setItem(SESSION_KEY, session); } catch (e) {} }
  if (hp.has("pmp_session") || err) history.replaceState(null, "", location.pathname + location.search);
  if (err) setTimeout(() => toast(err === "fora_do_server" ? "Você precisa estar no server do PMP no Discord." : err === "cancelado" ? "Login cancelado." : "Não deu pra entrar com o Discord."), 300);
})();
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(SERVER_URL + path, {
      method: opts.method || "GET",
      headers: { ...(session ? { Authorization: "Bearer " + session } : {}), ...(opts.body ? { "Content-Type": "application/json" } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch (e) { throw new Error("Sem conexão com o servidor do PMP."); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { logout(true); throw new Error("Entre com o Discord de novo."); }
  if (!res.ok) throw new Error(data.error || "Erro do servidor (" + res.status + ").");
  return data;
}
function login() {
  if (location.protocol === "file:") { toast("Abra o Criador pelo site (não pelo arquivo) para entrar."); return; }
  location.href = SERVER_URL + "/auth/login?ret=" + encodeURIComponent(location.href.split("#")[0]);
}
function logout(silent) {
  session = null; me = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  updateLogin();
  if (!silent) toast("Você saiu da conta");
  if (tab === "admin") tab = "pokemon";
  render();
}
async function loadMe() {
  if (!session) { me = null; updateLogin(); return; }

}

// ======================================================================
// ARQUIVO DE PROJETO (criptografado: só a conta do criador abre)
// ======================================================================
const PROJECT_FORMAT = "pmp-fakemon-project";
function bytesToB64(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64ToBytes(s) { const bin = atob(s); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
function b64urlToBytes(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return b64ToBytes(s); }
async function projectKey() {
  const { key } = await api("/api/project-key");
  return crypto.subtle.importKey("raw", b64urlToBytes(key), "AES-GCM", false, ["encrypt", "decrypt"]);
}
function saveBlob(blob, name) {
  const a = h("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function saveProject() {
  if (!me) { toast("Entre com o Discord para salvar o projeto"); return; }
  try {
    const key = await projectKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(state))));
    const file = { format: PROJECT_FORMAT, v: 1, owner: me.id, ownerName: me.name, name: state.meta.name, iv: bytesToB64(iv), data: bytesToB64(ct) };
    saveBlob(new Blob([JSON.stringify(file)], { type: "application/octet-stream" }), slug(state.meta.name) + ".pmpfkmn");
    toast("Projeto salvo. Só a sua conta do Discord abre ele.");
  } catch (e) { toast(e.message); }
}
async function openProject(file) {
  try {
    let f;
    try { f = JSON.parse(await file.text()); } catch (e) { f = null; }
    if (!f || f.format !== PROJECT_FORMAT) throw new Error("Esse arquivo não é um projeto do Criador.");
    if (!me) throw new Error("Entre com o Discord para abrir o projeto.");
    if (f.owner !== me.id) throw new Error("Esse projeto é de outra conta do Discord (" + (f.ownerName || "outro criador") + ").");
    const key = await projectKey();
    let plain;
    try { plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(f.iv) }, key, b64ToBytes(f.data)); }
    catch (e) { throw new Error("Projeto corrompido ou alterado."); }
    const loaded = JSON.parse(new TextDecoder().decode(plain));
    if (!loaded || !Array.isArray(loaded.pokemon)) throw new Error("Projeto inválido.");
    state = Object.assign(blankPack(), loaded); sel = { pokemon: 0, moves: 0, abilities: 0, items: 0 };
    saveDraft(); tab = "pokemon"; render(); toast("Projeto aberto: " + (state.meta.name || file.name));
  } catch (e) { toast(e.message); }
}

const STATUS_PT = { private: "Privado", pending: "Aguardando aprovação", public: "Público", rejected: "Recusado" };
function fmtDate(t) { try { return new Date(t).toLocaleDateString("pt-BR"); } catch (e) { return ""; } }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("Link copiado"); }
  catch (e) { toast("Selecione o link e copie (Ctrl+C)"); }
}
function linkBox(link, note) {
  const input = h("input", { value: link, readonly: true, "aria-label": "Link do pacote", onfocus: e => e.target.select() });
  return h("div", { class: "linkbox" }, h("div", { class: "lb-add" }, input, h("button", { class: "btn primary", onclick: () => copyText(link) }, "Copiar")),
    note ? h("p", { class: "hint" }, note) : null);
}
async function buildUpload(visibility) {
  for (const p of state.pokemon) if (p.sprite && (!p.icon || p.iconAuto)) { p.icon = await iconFromSprite(p.sprite); p.iconAuto = true; }
  saveDraft();
  const { data, images } = buildData();
  const imgs = {};
  for (const [k, url] of Object.entries(images)) imgs[k] = url.split(",")[1];
  const m = state.meta;
  return { visibility, index: { name: m.name, author: m.author, version: m.version, description: m.description }, data, images: imgs };
}

function renderExport() {
  const msgs = validate();
  const bad = msgs.filter(m => m[0] === "bad").length;
  const { data } = buildData();
  const auto = data["automations.json"];
  const autoCount = Object.keys(auto.abilities).length + Object.keys(auto.items).length + Object.keys(auto.moves).length;
  const pane = h("section", { class: "pane" },
    h("h2", {}, "Publicar pacote"),
    h("p", {}, `${state.pokemon.length} Fakemons · ${state.moves.length} Moves · ${state.abilities.length} Habilidades · ${state.items.length} Itens · ${autoCount} com automação`),
    h("div", { class: "msgs" }, msgs.length ? msgs.map(([k, t]) => h("div", { class: "msg " + k }, t)) : h("div", { class: "msg ok" }, "Tudo certo para publicar.")));
  if (!me) {
    pane.append(h("p", {}, "Para publicar, entre com o Discord. Precisa estar no server do PMP."),
      h("button", { class: "btn primary", onclick: login }, "Entrar com Discord"));
  } else {
    let visibility = "private";
    const opt = (v, title, desc) => {
      const r = h("input", { type: "radio", name: "vis", value: v, checked: v === visibility });
      r.addEventListener("change", () => { visibility = v; });
      return h("label", { class: "visopt" }, r, h("span", {}, h("b", {}, title), h("br"), h("span", { class: "hint" }, desc)));
    };
    const result = h("div", {});
    const btn = h("button", { class: "btn primary", disabled: bad > 0 }, bad ? `Corrija ${bad} erro(s)` : "Publicar no servidor do PMP");
    btn.addEventListener("click", async () => {
      btn.disabled = true; btn.textContent = "Enviando…";
      try {
        const r = await api("/api/publish", { method: "POST", body: await buildUpload(visibility) });
        result.replaceChildren(r.link
          ? linkBox(r.link, "Link privado: vale para 10 instalações (e até 30 dias). Gere outro em Meus pacotes quando acabar.")
          : h("div", { class: "msg ok" }, "Enviado! O pacote está aguardando aprovação. Quando for aprovado, o link eterno aparece em Meus pacotes."));
        loadMine(mineBox);
      } catch (e) { result.replaceChildren(h("div", { class: "msg bad" }, e.message)); }
      btn.disabled = false; btn.textContent = "Publicar no servidor do PMP";
    });
    const mineBox = h("div", { class: "pkglist" }, h("p", { class: "hint" }, "Carregando…"));
    pane.append(
      h("div", { class: "vis" },
        opt("private", "Privado", "Você recebe um link para até 10 instalações. Precisa gerar outro depois."),
        opt("public", "Público", "Vai para aprovação dos admins do PMP. Aprovado, ganha link eterno.")),
      btn, result,
      h("hr", { class: "sep" }), h("h2", {}, "Meus pacotes"), h("div", { style: "height:8px" }), mineBox);
    loadMine(mineBox);
  }
  pane.append(h("hr", { class: "sep" }),
    h("h2", {}, "Como colocar no app"), h("div", { style: "height:8px" }),
    h("ol", { class: "steps" },
      h("li", {}, "Publique aqui e copie o link."),
      h("li", {}, "Mande o link pra quem vai usar (no Discord do PMP, por exemplo)."),
      h("li", {}, "No app: copie o link e vá em Configurações → COLAR LINK. O app baixa, instala e reinicia."),
      h("li", {}, "O link só funciona dentro do app: no navegador ele não baixa nada.")),
    h("p", { class: "hint" }, "Para editar depois, use \"Salvar projeto\": o arquivo .pmpfkmn só abre com a sua conta do Discord."));
  return pane;
}

async function loadMine(box) {
  try {
    const { packages, publicLimit, publicUsed } = await api("/api/mine");
    const quota = h("p", { class: "hint" }, `Pacotes públicos (ou aguardando aprovação): ${publicUsed} de ${publicLimit}. Privados não entram nesse limite.`);
    if (!packages.length) { box.replaceChildren(quota, h("p", { class: "hint" }, "Você ainda não publicou nada.")); return; }
    box.replaceChildren(quota, ...packages.map(p => {
      const out = h("div", {});
      const actions = h("div", { class: "checks" });
      if (p.status === "public") actions.append(h("button", { class: "btn small primary", onclick: async () => { try { const r = await api("/api/link", { method: "POST", body: { id: p.id } }); out.replaceChildren(linkBox(r.link, "Link eterno.")); } catch (e) { toast(e.message); } } }, "Mostrar link eterno"));
      if (p.thread) actions.append(h("a", { class: "btn small", href: `https://discord.com/channels/1262406231033647124/${p.thread}`, target: "_blank", rel: "noopener" }, "Meu post no Discord"));
      else actions.append(h("button", { class: "btn small", onclick: async () => { try { const r = await api("/api/link", { method: "POST", body: { id: p.id } }); out.replaceChildren(linkBox(r.link, "Novo link: 10 instalações.")); } catch (e) { toast(e.message); } } }, "Gerar link (10 usos)"));
      actions.append(armedButton("Apagar", async () => { try { await api("/api/pkg/" + p.id, { method: "DELETE" }); loadMine(box); toast("Pacote apagado"); } catch (e) { toast(e.message); } }));
      return h("div", { class: "pkg" },
        h("div", { class: "pkg-head" }, h("b", {}, p.name || "(sem nome)"), h("span", { class: "badge " + p.status }, STATUS_PT[p.status] || p.status)),
        h("div", { class: "hint" }, `v${p.version || "?"} · ${fmtDate(p.created)} · ${pkgCounts(p.counts)}`),
        h("div", { class: "downloads" }, h("b", {}, String(p.downloads || 0)), p.downloads === 1 ? " download" : " downloads",
          p.status === "public" ? h("span", { class: "hint" }, " (cada aparelho conta uma vez)") : null),
        actions, out);
    }));
  } catch (e) { box.replaceChildren(h("div", { class: "msg bad" }, e.message)); }
}
function pkgCounts(c) { c = c || {}; return `${c.p || 0} Fakemons, ${c.m || 0} Moves, ${c.a || 0} Habilidades, ${c.i || 0} Itens`; }
function armedButton(label, action) {
  const b = h("button", { class: "btn small danger" }, label);
  b.addEventListener("click", () => {
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Confirmar?"; setTimeout(() => { if (b.isConnected) { b.textContent = label; delete b.dataset.armed; } }, 3000); return; }
    action();
  });
  return b;
}

// ADMIN: todos os pacotes publicados, aprovação dos públicos
// ======================================================================
let adminFilter = "pending";
function renderAdmin() {
  const pane = h("section", { class: "pane" }, h("h2", {}, "Painel de admin"));
  if (!me || !me.admin) { pane.append(h("p", {}, "Só para admins do PMP.")); return pane; }
  const list = h("div", { class: "pkglist" }, h("p", { class: "hint" }, "Carregando…"));
  const filter = h("select", { "aria-label": "Filtro" }, [["pending", "Aguardando aprovação"], ["public", "Públicos"], ["private", "Privados"], ["rejected", "Recusados"], ["all", "Todos"]].map(([v, t]) => h("option", { value: v, selected: v === adminFilter }, t)));
  filter.addEventListener("change", () => { adminFilter = filter.value; loadAdmin(list); });
  pane.append(h("div", { class: "inline", style: "margin:10px 0" }, h("label", {}, "Mostrar", filter), h("button", { class: "btn small", onclick: () => loadAdmin(list) }, "Atualizar")), list);
  loadAdmin(list);
  return pane;
}
async function loadAdmin(box) {
  try {
    const { packages, limits, defaultLimit } = await api("/api/admin/list");
    const shown = packages.filter(p => adminFilter === "all" || p.status === adminFilter);
    const usedBy = {};
    for (const p of packages) if (p.status === "public" || p.status === "pending") usedBy[p.owner] = (usedBy[p.owner] || 0) + 1;
    const limitEditor = p => {
      const cur = limits[p.owner] ?? defaultLimit;
      const input = h("input", { type: "number", min: 0, max: 100, value: cur, style: "width:64px", "aria-label": "Limite de públicos de " + (p.ownerName || p.owner) });
      const save = h("button", { class: "btn small", onclick: async () => {
        try { const r = await api("/api/admin/limit", { method: "POST", body: { user: p.owner, limit: Number(input.value) } }); toast(`Limite de ${p.ownerName || p.owner}: ${r.limit}`); loadAdmin(box); }
        catch (e) { toast(e.message); }
      } }, "Salvar");
      return h("div", { class: "inline", style: "margin:0" }, h("label", {}, `Públicos de ${p.ownerName || "?"}: ${usedBy[p.owner] || 0} de`, input), save);
    };
    if (!shown.length) { box.replaceChildren(h("p", { class: "hint" }, "Nenhum pacote aqui.")); return; }
    box.replaceChildren(...shown.map(p => {
      const out = h("div", {});
      const review = async approve => {
        try {
          const r = await api("/api/admin/review", { method: "POST", body: { id: p.id, approve } });
          const forumMsg = !r.forum ? "" : r.forum === "ok" ? " · post no Discord atualizado" : " · falhou no Discord (" + r.forum + ")";
          toast((approve ? "Aprovado" : "Recusado") + forumMsg);
          if (r.link) out.replaceChildren(linkBox(r.link, "Link eterno do pacote." + forumMsg));
          setTimeout(() => loadAdmin(box), approve ? 2500 : 0);
        } catch (e) { toast(e.message); }
      };
      const actions = h("div", { class: "checks" },
        h("button", { class: "btn small", onclick: () => previewPackage(p.id, out) }, "Ver conteúdo"),
        p.thread ? h("a", { class: "btn small", href: `https://discord.com/channels/1262406231033647124/${p.thread}`, target: "_blank", rel: "noopener" }, "Post no Discord") : null,
        p.status !== "public" ? h("button", { class: "btn small primary", onclick: () => review(true) }, "Aprovar (público)") : null,
        p.status !== "rejected" ? h("button", { class: "btn small", onclick: () => review(false) }, p.status === "public" ? "Tirar do público" : "Recusar") : null,
        armedButton("Apagar", async () => { try { await api("/api/pkg/" + p.id, { method: "DELETE" }); loadAdmin(box); toast("Pacote apagado"); } catch (e) { toast(e.message); } }));
      return h("div", { class: "pkg" },
        h("div", { class: "pkg-head" }, h("b", {}, p.name || "(sem nome)"), h("span", { class: "badge " + p.status }, STATUS_PT[p.status] || p.status)),
        h("div", { class: "hint" }, `Autor: ${p.author || "?"} · Discord: ${p.ownerName || "?"} (${p.owner || "?"}) · v${p.version || "?"} · ${fmtDate(p.created)}`),
        h("div", { class: "hint" }, pkgCounts(p.counts)),
        h("div", { class: "downloads" }, h("b", {}, String(p.downloads || 0)), p.downloads === 1 ? " download" : " downloads"),
        limitEditor(p), actions, out);
    }));
  } catch (e) { box.replaceChildren(h("div", { class: "msg bad" }, e.message)); }
}
async function previewPackage(id, box) {
  box.replaceChildren(h("p", { class: "hint" }, "Carregando…"));
  try {
    const p = await api("/api/admin/pkg/" + id);
    const d = p.data || {};
    const section = (title, obj, line) => {
      const entries = Object.entries(obj || {});
      if (!entries.length) return null;
      return h("div", {}, h("div", { class: "sub", style: "font-size:16px;margin:12px 0 4px" }, `${title} (${entries.length})`),
        h("div", { class: "preview" }, entries.map(([name, v]) => line(name, v || {}))));
    };
    const pk = section("Fakemons", d["pokemon.json"], (name, v) => h("div", { class: "pv-row" },
      v.sprite && p.images[v.sprite] ? h("img", { src: "data:image/png;base64," + p.images[v.sprite], alt: "", width: 63, height: 63 }) : h("span", { class: "pv-noimg" }),
      h("div", {}, h("b", {}, name), " #" + v.index + " · " + (v.Type || []).map(t => TYPE_PT[t] || t).join("/"),
        h("div", { class: "hint" }, "Habilidades: " + [...(v.Abilities || []), v["Hidden Ability"]].filter(Boolean).join(", ")))));
    const txt = (key) => (name, v) => h("div", { class: "pv-row" }, h("div", {}, h("b", {}, name), h("div", { class: "hint" }, String(v[key] || "").slice(0, 300))));
    const auto = d["automations.json"] || {};
    const autoN = ["abilities", "items", "moves"].reduce((n, k) => n + Object.keys(auto[k] || {}).length, 0);
    box.replaceChildren(h("div", { class: "previewbox" },
      h("div", { class: "hint" }, (p.index.description || "Sem descrição.") + (autoN ? ` · ${autoN} com automação` : "")),
      pk, section("Moves", d["moves.json"], txt("Description")), section("Habilidades", d["abilities.json"], txt("Description")), section("Itens", d["items.json"], txt("Effect"))));
  } catch (e) { box.replaceChildren(h("div", { class: "msg bad" }, e.message)); }
}
